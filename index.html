<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="description" content="CC Restaurant digital menu">
<title>CC Menu</title>
<link rel="icon" href="photos/default.png" type="image/png">
<link rel="apple-touch-icon" href="photos/default.png">
<meta property="og:image" content="photos/default.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="left-controls">
    <div class="view-toggle" role="group" aria-label="View style">
      <button id="listViewBtn" class="view-btn" aria-pressed="false" title="List view">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="cardViewBtn" class="view-btn active" aria-pressed="true" title="Card view">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/><rect x="3" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
  </div>
  <div class="brand">
    <div class="mark">CC</div>
    <div><h1 id="title">Restaurant</h1><p class="brand-subtle">CC Restaurant</p></div>
  </div>
  <label class="language">
    <span>🌐</span>
    <select id="language" aria-label="Language">
      <option value="tr">Türkçe</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ja-latn">日本語 (Latin)</option>
    </select>
  </label>
</header>

<nav id="categories" class="category-picker" aria-label="Menu categories" hidden>
  <button id="categoryHome" class="category-home" type="button">Ana Sayfaya Dön</button>
  <label class="category-select-wrap">
    <span id="categorySelectLabel">Kategoriler</span>
    <select id="categorySelect" aria-label="Kategoriler"></select>
  </label>
</nav>

<main id="menuSections"></main>

<p id="empty" hidden></p>

<footer>
  <p id="notice"></p>
</footer>

<button id="backToTop" class="back-to-top" type="button" hidden>↑</button>

<button id="feedbackBtn" class="feedback-btn" type="button" title="Geri Bildirim" aria-label="Geri Bildirim">
  <svg class="feedback-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.4 3.6A.7.7 0 0 1 4.5 19v-3.1A2.5 2.5 0 0 1 4 13.5v-8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="8.5" cy="9.5" r="1.1" fill="currentColor"/>
    <circle cx="12" cy="9.5" r="1.1" fill="currentColor"/>
    <circle cx="15.5" cy="9.5" r="1.1" fill="currentColor"/>
  </svg>
  <span id="feedbackLabel">Geri Bildirim</span>
</button>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <img id="modalImg" src="" alt="">
    <div class="modal-body">
      <p class="category-label" id="modalCategory"></p>
      <h3 id="modalName"></h3>
      <p class="modal-alt" id="modalAltLangs"></p>
      <p class="modal-ingredients" id="modalIngredients"></p>
      <span class="price" id="modalPrice"></span>
    </div>
  </div>
</div>

<script src="menu-data.js"></script>
<script src="app.js"></script>
</body>
</html>
